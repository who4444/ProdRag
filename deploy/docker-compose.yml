services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo >&3'"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: ../.env
    environment:
      PRODRAG_QDRANT_URL: http://qdrant:6333
      PRODRAG_REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: arq app.worker.WorkerSettings
    env_file: ../.env
    environment:
      PRODRAG_QDRANT_URL: http://qdrant:6333
      PRODRAG_REDIS_URL: redis://redis:6379
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  qdrant_data:
