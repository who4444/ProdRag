[project]
name = "prodrag"
version = "0.2.0"
description = "Production-grade multimodal RAG backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "qdrant-client>=1.10",
    "arq>=0.26",
    "redis>=5.0",
    "openai>=1.40",
    "pydantic-settings>=2.4",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "langchain-text-splitters>=1.1.2",
    "pytesseract>=0.3.13",
    "supabase>=2.31.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]
modal = ["modal>=0.73.82"]
frontend = ["streamlit>=1.36", "requests>=2.31", "pandas>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 140
target-version = "py312"
exclude = [".venv", "frontend", "deploy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
